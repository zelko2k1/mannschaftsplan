# Was hier läuft, muss auch lokal laufen — und umgekehrt.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Der Build ist zugleich der Typcheck (tsc -b läuft davor).
      - run: npm run build

  # Der Changelog ist die einzige Stelle, an der die Mannschaft nachlesen kann, was sich
  # geändert hat — er verfällt genau dann, wenn ihn niemand einfordert.
  changelog:
    name: Changelog gepflegt
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eintrag verlangen, wenn ausgeliefertes Verhalten sich ändert
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          geaendert="$(git diff --name-only "$base...HEAD")"
          # Nur was bei der Mannschaft ankommt: Oberfläche, Server-Teil, Betriebsskripte,
          # Deployment. Tests, CI und Doku bleiben bewusst außen vor — sie ändern nichts am
          # Betrieb.
          code="$(printf '%s\n' "$geaendert" | grep -E '^(app/src/|pocketbase/pb_hooks/|pocketbase/pb_migrations/|scripts/|deploy/)' | grep -v '\.test\.ts$' || true)"
          if [ -z "$code" ]; then
            echo "Kein ausgeliefertes Verhalten geändert — kein Eintrag nötig."
            exit 0
          fi
          if printf '%s\n' "$geaendert" | grep -qx 'CHANGELOG.md'; then
            echo "Changelog ist gepflegt."
            exit 0
          fi
          echo "::error::Dieser PR ändert ausgeliefertes Verhalten, aber nicht CHANGELOG.md."
          printf '%s\n' "$code" | sed 's/^/  · /'
          echo "Bitte unter '## [Unveröffentlicht]' eintragen — oder das Label 'no-changelog' setzen, wenn sich für die Mannschaft nichts ändert."
          exit 1

  skripte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Skripte auf Syntaxfehler prüfen
        run: for f in scripts/*.sh; do bash -n "$f"; done

  # Die Caddy-Vorlagen landen unverändert im Betrieb — die eine wird ins Overlay eingehängt, die
  # andere kopieren Betreiber in ihre vorhandene Konfiguration. Ein Syntaxfehler darin fiele sonst
  # erst dem auf, der sie einsetzt. Geprüft wird gegen dieselbe Caddy-Version wie im Overlay.
  proxy:
    name: Caddy-Vorlagen
    runs-on: ubuntu-latest
    env:
      CADDY_IMAGE: caddy:2.11.4-alpine
    steps:
      - uses: actions/checkout@v4

      - name: deploy/Caddyfile — wie das Overlay ihn startet
        run: |
          set -euo pipefail
          # Der Hash wird hier erzeugt und nicht abgelegt: im Repo hat kein Zugang etwas verloren,
          # auch kein erfundener. Nebenbei belegt der Aufruf, dass die Anleitung in .env.example
          # stimmt.
          hash="$(docker run --rm "$CADDY_IMAGE" caddy hash-password --plaintext 'nur-fuer-die-ci')"
          docker run --rm \
            -e DOMAIN=dart.example.de \
            -e ACME_EMAIL=ci@example.com \
            -e ADMIN_USER=ci \
            -e ADMIN_PASSWORD_HASH="$hash" \
            -v "$PWD/deploy:/vorlagen:ro" "$CADDY_IMAGE" \
            caddy validate --adapter caddyfile --config /vorlagen/Caddyfile

      - name: deploy/Caddyfile — mit eingeschalteter Allowlist (R13b, Weg 1)
        run: |
          set -euo pipefail
          mkdir -p ci-vorlagen
          sed -e 's|# @fremd|@fremd|' -e 's|# respond @fremd|respond @fremd|' \
            deploy/Caddyfile > ci-vorlagen/Caddyfile
          hash="$(docker run --rm "$CADDY_IMAGE" caddy hash-password --plaintext 'nur-fuer-die-ci')"
          docker run --rm \
            -e DOMAIN=dart.example.de \
            -e ACME_EMAIL=ci@example.com \
            -e ADMIN_USER=ci \
            -e ADMIN_PASSWORD_HASH="$hash" \
            -e ADMIN_ALLOW=10.8.0.0/24 \
            -v "$PWD/ci-vorlagen:/vorlagen:ro" "$CADDY_IMAGE" \
            caddy validate --adapter caddyfile --config /vorlagen/Caddyfile

      - name: Kommt der bcrypt-Hash unversehrt in Caddy an?
        run: |
          set -euo pipefail
          # Ein bcrypt-Hash steckt voller '$', und Compose löst '$' in .env-Dateien auf. Käme der
          # Hash verstümmelt im Container an, wäre die Anleitung in der README falsch und der
          # Betreiber stünde vor einer Tür, die sein Passwort nicht annimmt. Also nachgesehen.
          hash="$(docker run --rm "$CADDY_IMAGE" caddy hash-password --plaintext 'nur-fuer-die-ci')"
          printf 'DOMAIN=dart.example.de\nACME_EMAIL=ci@example.com\nADMIN_USER=ci\nADMIN_PASSWORD_HASH=%s\n' "$hash" > .env
          # Gefragt ist der Wert IM CONTAINER, nicht der in `docker compose config`: dessen
          # Ausgabe verdoppelt jedes '$' zu '$$', damit sie selbst wieder eine gültige
          # Compose-Datei ist. Wer das misst, misst die Ausgabeform und nicht die Wirklichkeit.
          angekommen="$(docker compose -f docker-compose.yaml -f docker-compose.caddy.yaml \
            run --rm --no-deps --entrypoint sh caddy -c 'printf %s "$ADMIN_PASSWORD_HASH"')"
          echo "erzeugt:   $hash"
          echo "angekommen: $angekommen"
          rm -f .env
          if [ "$hash" != "$angekommen" ]; then
            echo "::error::Der bcrypt-Hash überlebt den Weg durch die .env nicht — README und .env.example stimmen dann nicht."
            exit 1
          fi

      - name: deploy/Caddyfile.homelab.example — Syntax
        run: |
          set -euo pipefail
          # Hier nur `adapt` statt `validate`: die Datei nennt ein Zertifikat, das es auf dem
          # Runner nicht gibt, und `validate` würde daran scheitern statt an der Syntax. Der
          # Platzhalter für den Netzbereich wird für die Prüfung ersetzt — im Repo bleibt er
          # stehen, damit ihn niemand unbesehen übernimmt.
          mkdir -p ci-vorlagen
          sed 's|<dein-netzbereich>|192.168.1.0/24|' \
            deploy/Caddyfile.homelab.example > ci-vorlagen/homelab.Caddyfile
          docker run --rm -v "$PWD/ci-vorlagen:/vorlagen:ro" "$CADDY_IMAGE" \
            caddy adapt --adapter caddyfile --config /vorlagen/homelab.Caddyfile > /dev/null

      - name: Formatierung
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/deploy:/vorlagen:ro" "$CADDY_IMAGE" \
            caddy fmt --diff /vorlagen/Caddyfile | tee /tmp/fmt1
          docker run --rm -v "$PWD/deploy:/vorlagen:ro" "$CADDY_IMAGE" \
            caddy fmt --diff /vorlagen/Caddyfile.homelab.example | tee /tmp/fmt2
          if grep -qE '^[-+]' /tmp/fmt1 /tmp/fmt2; then
            echo "::error::Caddy-Vorlage nicht formatiert — 'caddy fmt --overwrite' laufen lassen."
            exit 1
          fi

  # Das Deployment ist EIN Image: PocketBase mit dem gebauten Frontend in pb_public, Migrationen
  # und Hooks fest eingebacken. Auf dem Entwicklungsrechner läuft kein Docker — deshalb wird das
  # hier gebaut UND angefahren. Ein Dockerfile, das nur im Repo liegt und nie gestartet wurde,
  # ist eine Behauptung, kein Deployment.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compose-Dateien prüfen — beide Varianten aus 7.1
        env:
          # Das Overlay verlangt diese Werte (`${VAR:?...}`) und fährt ohne sie bewusst nicht an.
          # Hier stehen Wegwerf-Werte, nur damit `config` durchläuft.
          DOMAIN: dart.example.de
          ACME_EMAIL: ci@example.com
          ADMIN_USER: ci
          ADMIN_PASSWORD_HASH: nur-fuer-die-ci
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml config > /dev/null
          # Das Overlay reicht die .env per env_file an Caddy durch — die Datei muss also da
          # sein. Beim Betreiber ist sie es (Schritt 2 der Anleitung), hier nicht: .env ist
          # gitignored und wird für diesen Lauf angelegt.
          printf 'DOMAIN=%s\nACME_EMAIL=%s\nADMIN_USER=%s\nADMIN_PASSWORD_HASH=%s\n' \
            "$DOMAIN" "$ACME_EMAIL" "$ADMIN_USER" "$ADMIN_PASSWORD_HASH" > .env
          docker compose -f docker-compose.yaml -f docker-compose.caddy.yaml config > /dev/null
          rm -f .env

      - name: Image bauen
        run: docker build -f deploy/Dockerfile -t mannschaftsplan:ci .

      - name: Container starten
        run: |
          docker run -d --name mp -p 8090:8090 mannschaftsplan:ci \
            serve --automigrate=0 --http=0.0.0.0:8090 --dir=/pb_data \
            --hooksDir=/pb/hooks --migrationsDir=/pb/migrations --publicDir=/pb/pb_public
          for _ in $(seq 1 60); do
            curl -fsS --max-time 1 http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/health > /dev/null

      - name: Steckt wirklich alles im Image?
        run: |
          set -euo pipefail
          echo "— Frontend aus pb_public"
          curl -fsS http://127.0.0.1:8090/ | grep -q 'id="root"'
          echo "— robots.txt aus dem Image, nicht der SPA-Fallback (R9)"
          curl -fsS http://127.0.0.1:8090/robots.txt | grep -q '^Disallow: /$'
          echo "— Hooks geladen: die Einladungsseite kommt aus session.pb.js"
          curl -fsS http://127.0.0.1:8090/j/beliebig | grep -q 'action="/api/session"'
          echo "— Migrationen gelaufen und Collections gesperrt"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/collections/fixtures/records)" = 403
          echo "— Sicherheitskopfzeilen auch ohne Caddy (R9)"
          curl -sD - -o /dev/null http://127.0.0.1:8090/api/health | grep -qi '^x-robots-tag: noindex'
          curl -sD - -o /dev/null http://127.0.0.1:8090/api/health | grep -qi '^content-security-policy:'

      - name: Die Testfälle gegen den Container
        env:
          PB_SUPERUSER_EMAIL: ci@example.com
          PB_SUPERUSER_PASSWORD: nur-fuer-die-ci-2026
        run: |
          docker exec mp /usr/local/bin/pocketbase superuser upsert \
            "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=/pb_data
          node scripts/api-tests.mjs

      - name: Log des Containers
        if: always()
        run: docker logs mp

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Start, Superuser und Tests in EINEM Schritt: ein per & gestarteter Prozess überlebt das
      # Ende seines Schritts nicht zuverlässig.
      - name: PocketBase starten und die Testfälle laufen lassen
        env:
          PB_SUPERUSER_EMAIL: ci@example.com
          # Wegwerf-Zugang für eine Wegwerf-Datenbank auf einem Wegwerf-Runner. Es gibt hier
          # nichts zu schützen — die Instanz existiert für die Dauer dieses Jobs und ist von
          # außen nicht erreichbar.
          PB_SUPERUSER_PASSWORD: nur-fuer-die-ci-2026
        run: |
          set -euo pipefail
          ./scripts/dev-pb.sh &
          for _ in $(seq 1 60); do
            curl -fsS --max-time 1 http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/health > /dev/null
          (cd pocketbase && ./pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=pb_data)
          node scripts/api-tests.mjs
