# Was hier läuft, muss auch lokal laufen — und umgekehrt.
# Die API-Testfälle (T1–T7, T9, T13) kommen dazu, sobald es in Schritt 3 Routen gibt, gegen die
# sie laufen können; sie brauchen ein Wegwerf-PocketBase in einem eigenen Job-Schritt.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Der Build ist zugleich der Typcheck (tsc -b läuft davor).
      - run: npm run build

  skripte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Skripte auf Syntaxfehler prüfen
        run: for f in scripts/*.sh; do bash -n "$f"; done
