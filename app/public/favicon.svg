<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Der Aushang, wie ihn die App zeigt: gelbes Papier (Auswärtsspiel), schwarzer Kopfbalken,
       darunter zwei Zeilen aus kurzer Uhrzeit und langem Zielort. Farben und Regeln aus
       Abschnitt 6.2 des Umsetzungsplans — Ecken 0 px, keine Schatten, keine Verläufe.

       Jede Koordinate ist ein Vielfaches von 4. Bei 64/4 = 16 fällt damit jede Kante genau auf
       eine Pixelgrenze, und das Zeichen bleibt in der Registerkarte scharf statt grau
       auszulaufen. Wer hier etwas verschiebt, verschiebt es um 4. -->
  <rect width="64" height="64" fill="#F5B800"/>
  <rect x="0"  y="0"  width="64" height="16" fill="#17150F"/>
  <rect x="8"  y="28" width="12" height="8"  fill="#17150F"/>
  <rect x="24" y="28" width="32" height="8"  fill="#17150F"/>
  <rect x="8"  y="44" width="12" height="8"  fill="#17150F"/>
  <rect x="24" y="44" width="20" height="8"  fill="#17150F"/>
</svg>
