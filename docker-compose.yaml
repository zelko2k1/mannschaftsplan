# Der Stack für den Betrieb auf einem eigenen Server.
# Ein Service: PocketBase serviert das Frontend gleich mit. Davor gehört ein Reverse Proxy, der
# HTTPS terminiert — entweder ein bereits vorhandener oder der aus deploy/Caddyfile.
#
# Diese Datei liegt bewusst in der REPO-WURZEL und nicht in deploy/: der Build-Kontext ist die
# Wurzel, und ein Kontext oberhalb der Compose-Datei (`context: ..`) bricht, sobald das Werkzeug
# relative Pfade gegen das Projektverzeichnis auflöst statt gegen den Ort der Datei. Arcane tut
# genau das und sucht das Dockerfile dann eine Ebene zu hoch.
services:
  mannschaftsplan:
    build:
      # Wurzel des Repos: das Dockerfile braucht app/ UND pocketbase/.
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Fester Name, damit Caddy den Container per DNS findet — sonst hinge der Name vom
    # Stack-Namen ab, den Arcane vergibt.
    container_name: mannschaftsplan

    # Command explizit setzen, damit die ins Image gebackenen Pfade benutzt werden und nicht
    # /pb_migrations bzw. /pb_hooks (das könnten Volumes des Basis-Images sein).
    command:
      - serve
      # automigrate AUS: Schema-Änderungen im Dashboard dürfen keine neuen Migrationsdateien
      # erzeugen, die sich mit der Baseline im Image beißen.
      - --automigrate=0
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --hooksDir=/pb/hooks
      - --migrationsDir=/pb/migrations
      - --publicDir=/pb/pb_public

    # KEIN ports: — der einzige Weg hinein führt über den Reverse Proxy. Ein veröffentlichter
    # Host-Port wäre Klartext-HTTP am TLS-Proxy vorbei und würde /admin und /_/ aus R13
    # offenlegen.
    #
    # Ausnahme für R13a: Das Dashboard unter /_/ ist im Proxy dauerhaft mit 404 dicht. Wer
    # dorthin muss — Einrichten, Restore, Notfall — aktiviert die Zeile unten und tunnelt:
    #     ssh -L 8090:127.0.0.1:8090 <server>
    # Die Bindung an 127.0.0.1 ist der Unterschied zu "8090:8090": erreichbar nur auf dem
    # Server selbst und für den, der sich per SSH dorthin verbinden darf. Danach wieder
    # auskommentieren — offen bleiben muss sie nicht.
    # ports:
    #   - "127.0.0.1:8090:8090"
    expose:
      - "8090"

    volumes:
      # Persistent: SQLite, Uploads, Backups. Migrationen und Hooks liegen im Image und
      # brauchen kein Volume. Ohne dieses Volume sind die Daten nach einem Redeploy weg.
      - pb_data:/pb_data

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pb_data:

# Benanntes Netz, damit ein Caddy aus einem ANDEREN Stack sich dazuhängen kann:
#   docker network connect mannschaftsplan <caddy-container>
# Danach erreicht Caddy den Dienst als http://mannschaftsplan:8090. Ohne das findet der
# Reverse Proxy den Container nicht, weil hier bewusst kein Host-Port veröffentlicht wird.
networks:
  default:
    name: mannschaftsplan
